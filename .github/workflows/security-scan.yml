name: Security scan

# Scans changed skills for security red flags (data exfiltration, credential
# access, agent-memory theft, silent installs, etc.) using Cisco's
# cisco-ai-skill-scanner. Runs static + behavioral analysis (no API key needed);
# LLM semantic analysis is optional (see docs/SECURITY-SCANNING.md).
#
# Mark "Scan skills for security red flags" as a required status check in
# branch protection to block merges on HIGH findings.

on:
  pull_request:
    paths:
      - 'foundation-wide/skills/**'
      - 'groups/**/skills/**'
      - 'scanner/**'
      - '.github/workflows/security-scan.yml'
  push:
    branches: [main]
    paths:
      - 'foundation-wide/skills/**'
      - 'groups/**/skills/**'
      - 'scanner/**'
      - '.github/workflows/security-scan.yml'
  workflow_dispatch:   # allow manual re-run from the Actions tab

permissions:
  contents: read
  security-events: write   # required to upload SARIF to code scanning
  actions: read

jobs:
  scan:
    name: Scan skills for security red flags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scanner
        run: pip install cisco-ai-skill-scanner

      - name: Scan skills (static + behavioral; fail on HIGH)
        run: |
          skill-scanner scan-all . \
            --recursive \
            --check-overlap \
            --use-behavioral \
            --custom-rules scanner/custom-yara \
            --format sarif \
            --output results.sarif \
            --fail-on-severity high

      # Inline PR annotations — requires GitHub code scanning (Advanced Security)
      # to be enabled on the repo. Non-fatal: if it's not enabled, the security
      # gate (the scan step above) still stands.
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

      # Fallback so findings are always retrievable, even without code scanning.
      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: results.sarif
